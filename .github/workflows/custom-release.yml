# Custom patch (dev branch): fork release pipeline.
# The fork publishes its own releases; the upstream release.yml would double-build
# the wrong asset layout on the same tag push, so it stays tag-push disabled
# (see the anchored edit in .github/workflows/release.yml).
#
# Pushing a v* tag on dev (or dispatching with an existing tag) builds the single
# user-facing package — a multi-file self-contained ZIP wrapped in one top-level
# PaperTodo/ folder with a Chinese "run me" note at the top — plus the SHA-256
# manifest for the incremental OTA client and, when a previous release exists,
# a delta bundle. The single-file exe asset was dropped: same ~77 MB as the ZIP,
# no incremental upgrade path, and the ZIP structure now solves first-run discovery.
name: Custom Release

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v1.0.0，必须已存在）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: custom-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only a tag push (or an explicit dispatch naming one) actually publishes;
    # plain dev-branch pushes skip the job entirely.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: Build and publish custom release
    runs-on: windows-latest
    timeout-minutes: 40

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { "$env:GITHUB_REF_NAME" }
          if (-not $tag -or $tag -notmatch '^v[0-9]') {
            throw "Release requires an existing tag like v1.0.0; got '$tag'."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Verify project version matches tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $project = [xml](Get-Content -LiteralPath .\PaperTodo.csproj -Raw)
          $versionNodes = $project.SelectNodes('/Project/PropertyGroup/Version')
          if ($versionNodes.Count -ne 1) {
            throw "PaperTodo.csproj must define exactly one <Version> element (found $($versionNodes.Count))."
          }
          $projectVersion = ([string]$versionNodes[0].InnerText).Trim()
          if ($projectVersion -ne $env:VERSION) {
            throw "PaperTodo.csproj Version '$projectVersion' does not match tag '$env:VERSION'. Bump the project version before tagging."
          }

      - name: Rebuild native LMDB library
        run: .\native\lmdb\build.ps1 -Configuration Release -ForceRebuild

      - name: Restore
        run: dotnet restore .\PaperTodo.csproj -r win-x64

      - name: Publish multi-file package (self-contained)
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "papertodo-multi"
          Remove-Item -LiteralPath $publishDir -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish .\PaperTodo.csproj `
            -c Release -r win-x64 --self-contained true --no-restore `
            -o $publishDir `
            /p:PublishSingleFile=false `
            /p:PublishReadyToRun=false `
            /p:IncludeNativeLibrariesForSelfExtract=false `
            /p:PublishTrimmed=false `
            /p:EmbedAllSources=false `
            /p:EmbedUntrackedSources=false `
            /p:DebugType=none `
            /p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Users unzip next to their data; ship only what the app needs to run.
          Get-ChildItem -LiteralPath $publishDir -Recurse -Include *.pdb,*.xml |
            Where-Object { $_.FullName -notmatch '\\runtimes\\' } |
            Remove-Item -Force

          $packageDir = "package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          # One top-level folder inside the ZIP: after "extract all" the user gets a
          # single PaperTodo directory instead of ~300 loose files. Numbered guides
          # sort to the top in Explorer: "1 启动.bat" (ASCII content, relative %~dp0
          # launch — double-click runs the app) and "2 使用说明.txt" (UTF-8 BOM keeps
          # Notepad happy). Guides are NOT part of the OTA manifest (excluded below).
          [IO.File]::WriteAllText((Join-Path $publishDir "1 启动.bat"),
            "@echo off`r`nstart `"`" `"%~dp0PaperTodo.exe`"`r`n",
            [System.Text.ASCIIEncoding]::new())
          $noteBody = @(
            "PaperTodo 个人定制构建",
            "══════════════════════════",
            "第 1 步：双击本文件夹里的「1 启动.bat」或 PaperTodo.exe",
            "        （已内置完整运行环境，无需安装任何东西）",
            "",
            "第 2 步：日常升级 设置 → 关于 → 检查更新（自动增量，约 1-2 MB）",
            "",
            "默认已启用：浅色纸张 · 纸片置顶（图钉可关）· 顶栏四个快捷按钮 · Alt+O 收起/恢复纸片 · Alt+P 隐藏/显示软件",
            "· 笔记预览态按住正文拖动窗口；待办纸按住「＋」下方空白拖动窗口",
            "· Shift+滚轮调当前纸片透明度（每张独立，未调过的纸保持不透明）；Ctrl+滚轮调字号",
            "· 想跟随系统深色 → 设置→外观→主题；不想置顶 → 点图钉",
            "",
            "建议整个文件夹解压到任意位置后使用，数据保存在程序目录。"
          ) -join "`n"
          [IO.File]::WriteAllText((Join-Path $publishDir "2 使用说明.txt"), $noteBody + "`n",
            [System.Text.UTF8Encoding]::new($true))

          $zipName = "PaperTodo-v$($env:VERSION)-win-x64-multi-file.zip"
          # Compress the DIRECTORY itself (not its contents): "dir/*" produces flat
          # root entries, while "dir" nests everything under PaperTodo\ — one top-level
          # folder after extraction.
          # Copy-Item must use -Path here: -LiteralPath does not expand the "*" glob
          # and would silently copy nothing (same trap as Test-Path -LiteralPath).
          $zipRoot = Join-Path $env:RUNNER_TEMP "papertodo-ziproot\PaperTodo"
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "papertodo-ziproot") -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $zipRoot | Out-Null
          Copy-Item -Path (Join-Path $publishDir "*") -Destination $zipRoot -Recurse
          Compress-Archive -Path $zipRoot -Destination (Join-Path $packageDir $zipName) -CompressionLevel Optimal
          Get-Item -LiteralPath (Join-Path $packageDir $zipName) | Format-Table Name, Length

      - name: Generate OTA manifest and delta bundle
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The manifest hashes the MULTI-FILE layout: that is what the OTA client
          # compares against. The delta bundle carries only files whose hash differs
          # from the previous release (plus new files), so an up-to-date user downloads
          # megabytes, not the full package. The "!" run-me note must stay out of the
          # manifest: it exists only in the ZIP, and older clients reject unknown payload
          # entries — the client strips the PaperTodo/ prefix and skips unlisted files.
          $publishDir = Join-Path $env:RUNNER_TEMP "papertodo-multi"
          $files = Get-ChildItem -LiteralPath $publishDir -Recurse -File |
            Where-Object { $_.Name -ne "1 启动.bat" -and $_.Name -ne "2 使用说明.txt" } |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($publishDir, $_.FullName)
              [ordered]@{
                path = $relative.Replace('/', '\')
                size = $_.Length
                sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            } | Sort-Object { $_.path }

          $delta = $null
          $previousManifestJson = $null
          gh release view --repo $env:GITHUB_REPOSITORY --json tagName,assets *> $null
          # A missing release is an expected probe outcome, not a step failure. Clear the
          # stale exit code right away: GitHub's pwsh wrapper ends the whole step with
          # "exit $LASTEXITCODE", so an unreset failed probe would fail the step even
          # though every later command succeeded.
          $probeOk = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($probeOk) {
            $previous = gh release view --repo $env:GITHUB_REPOSITORY --json tagName,assets | ConvertFrom-Json
            $global:LASTEXITCODE = 0
            $hasPreviousManifest = @($previous.assets) | Where-Object { $_.name -eq "manifest.json" }
            if ($hasPreviousManifest) {
              $previousTag = $previous.tagName
              gh release download $previousTag --repo $env:GITHUB_REPOSITORY --pattern manifest.json --output previous-manifest.json --clobber
              $downloadOk = ($LASTEXITCODE -eq 0)
              $global:LASTEXITCODE = 0
              if ($downloadOk) {
                $previousManifestJson = Get-Content -LiteralPath previous-manifest.json -Raw | ConvertFrom-Json
              }
            }
          }

          if ($previousManifestJson) {
            $previousFiles = @{}
            foreach ($f in $previousManifestJson.files) { $previousFiles[$f.path] = $f.sha256 }
            $changed = @($files | Where-Object { -not $previousFiles.ContainsKey($_.path) -or $previousFiles[$_.path] -ne $_.sha256 })
            $deleted = @($previousFiles.Keys | Where-Object { $files.path -notcontains $_ })
            if ($changed.Count -gt 0) {
              $deltaRoot = Join-Path $env:RUNNER_TEMP "papertodo-delta"
              New-Item -ItemType Directory -Force -Path $deltaRoot | Out-Null
              foreach ($f in $changed) {
                $source = Join-Path $publishDir ($f.path.Replace('\', '/'))
                $dest = Join-Path $deltaRoot ($f.path.Replace('\', '/'))
                New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dest) | Out-Null
                Copy-Item -LiteralPath $source -Destination $dest
              }
              $deltaAsset = "delta-from-v$($previousManifestJson.version).zip"
              Compress-Archive -Path (Join-Path $deltaRoot "*") -Destination (Join-Path "package" $deltaAsset) -CompressionLevel Optimal
              $delta = [ordered]@{
                from = $previousManifestJson.version
                asset = $deltaAsset
                files = @($changed | ForEach-Object { $_.path })
                deleted = $deleted
              }
              Write-Host "Delta bundle: $($changed.Count) changed, $($deleted.Count) deleted."
            } else {
              Write-Host "No file changed since v$($previousManifestJson.version); no delta bundle."
            }
          } else {
            Write-Host "No previous release manifest found; first release ships without a delta bundle."
          }

          $manifest = [ordered]@{
            version = $env:VERSION
            channel = "stable"
            packaging = "multi-file"
            files = $files
            delta = $delta
          }
          # UTF8 without BOM: the in-app parser tolerates a BOM, but keep it clean anyway.
          $manifest | ConvertTo-Json -Depth 5 | ForEach-Object { $_ -replace "`r`n", "`n" } |
            Set-Content -LiteralPath (Join-Path "package" "manifest.json") -Encoding utf8NoBOM
          Get-Content -LiteralPath (Join-Path "package" "manifest.json") -TotalCount 20

      - name: Build release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Fork releases carry a compact bilingual header plus the custom-features link.
          # Upstream's release_notes.py changelog extraction does not apply to the fork's
          # independent version sequence.
          $version = $env:TAG.TrimStart('v')
          $notes = @"
          ## Custom build release
          个人定制构建（基于上游 PaperTodo，定制功能说明见仓库 [CUSTOM_FEATURES.md](https://github.com/coochow/PaperTodo/blob/dev/CUSTOM_FEATURES.md)）。

          ### 下载 / Downloads
          - **PaperTodo-v$version-win-x64-multi-file.zip** — 唯一发布包：内置 .NET 运行时，解压得到一个 PaperTodo 文件夹，双击其中的 PaperTodo.exe 即用，无需安装任何依赖。

          > 日常升级请在应用内「设置 → 关于 → 检查更新」完成，只下载有变化的文件（增量约 1-2 MB）。
          "@
          $notes -replace "`r`n", "`n" | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $assets = @(
            "package/PaperTodo-v$($env:VERSION)-win-x64-multi-file.zip",
            "package/manifest.json"
          )
          # -LiteralPath does not expand wildcards (Test-Path would always return False);
          # use -Path so the delta glob actually matches when a bundle exists.
          $deltaAssets = @(Get-ChildItem -Path "package/delta-from-v*.zip" -ErrorAction SilentlyContinue)
          if ($deltaAssets.Count -gt 0) {
            $assets += $deltaAssets.FullName
          }
          gh release create $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "PaperTodo $env:TAG (custom build)" `
            --notes-file release-notes.md `
            @assets
